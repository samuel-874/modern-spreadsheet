<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gridbookGrad" x1="20" y1="20" x2="236" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eb714c"/>
      <stop offset="100%" stop-color="#d65730"/>
    </linearGradient>
    <filter id="iconShadow" x="4" y="8" width="248" height="248" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#a83c18" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect x="20" y="20" width="216" height="216" rx="50" fill="url(#gridbookGrad)" filter="url(#iconShadow)"/>
  <rect x="20.5" y="20.5" width="215" height="215" rx="49.5" stroke="white" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Perfectly Centered Gridbook Motif -->
  <g transform="translate(45.66, 42.08) scale(7.16)">
    <!-- Book Body -->
    <rect x="5" y="2.5" width="15.5" height="19" rx="2.5" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Spine Margin Divider -->
    <line x1="8.5" y1="2.5" x2="8.5" y2="21.5" stroke="white" stroke-width="1.2" opacity="0.45"/>
    <!-- Left Spiral Coils -->
    <path d="M2.5 6.5H6.25M2.5 10.5H6.25M2.5 14.5H6.25M2.5 18.5H6.25" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Spreadsheet Table Header Row -->
    <rect x="10" y="6" width="8" height="3.5" rx="0.5" fill="white" opacity="0.22"/>
    <!-- Selected Active Cell (A2) -->
    <rect x="10" y="9.5" width="4" height="4" rx="0.5" fill="white" opacity="0.48"/>
    <!-- Grid Column and Row Lines -->
    <line x1="14" y1="6" x2="14" y2="17.5" stroke="white" stroke-width="1.2" opacity="0.85" stroke-linecap="round"/>
    <line x1="10" y1="9.5" x2="18" y2="9.5" stroke="white" stroke-width="1.2" opacity="0.85" stroke-linecap="round"/>
    <line x1="10" y1="13.5" x2="18" y2="13.5" stroke="white" stroke-width="1.2" opacity="0.85" stroke-linecap="round"/>
  </g>
</svg>